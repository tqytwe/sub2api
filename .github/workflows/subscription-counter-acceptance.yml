name: Subscription counter acceptance

on:
  pull_request:
    branches: [play/main]
    paths:
      - .github/workflows/subscription-counter-acceptance.yml
      - scripts/test-subscription-counters.sh
      - backend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-counters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-http-counters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Real HTTP, full migrations, settlement and API counters
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-subscription-counters.sh | tee "$RUNNER_TEMP/subscription-counters.log"
      - name: Preserve strict acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: subscription-counter-evidence
          path: ${{ runner.temp }}/subscription-counters.log
          if-no-files-found: error
