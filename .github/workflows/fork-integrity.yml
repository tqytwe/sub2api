name: Fork Integrity

on:
  pull_request:
    branches:
      - play/main
      - 'sync/upstream-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Release source policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Test source lock and publication boundaries offline
        run: |
          python3 -m venv "$RUNNER_TEMP/release-policy"
          source "$RUNNER_TEMP/release-policy/bin/activate"
          python -m pip install -r .github/release-tools/requirements-release.txt
          python -m unittest discover -s scripts -p test_upstream_release_check.py
          python -m unittest discover -s scripts -p test_upstream_dispositions.py
          python scripts/check_upstream_dispositions.py
          python -m unittest discover -s .github/release-tools -p test_release_matrix.py
          bash -n .github/release-tools/release-images.sh
      - name: Require source-verified, merge-ready scope for upstream sync PRs
        if: startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          tag="$(python3 -c 'import json; print(json.load(open("docs/upstream-migrations/source-lock.json"))["release_tag"])')"
          git fetch --no-tags https://github.com/ranxi2001/sub2api.git \
            "refs/tags/${tag}:refs/tags/upstream-sync-${tag}"
          expected_tag="$(python3 -c 'import json; print(json.load(open("docs/upstream-migrations/source-lock.json"))["tag_object"])')"
          expected_commit="$(python3 -c 'import json; print(json.load(open("docs/upstream-migrations/source-lock.json"))["release_commit"])')"
          test "$(git rev-parse "refs/tags/upstream-sync-${tag}")" = "$expected_tag"
          test "$(git rev-parse "refs/tags/upstream-sync-${tag}^{commit}")" = "$expected_commit"
          python scripts/check_upstream_dispositions.py --verify-git --require-merge-ready

  protected-behavior:
    name: Protected behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check Docker Go version matches module
        shell: bash
        run: |
          module_go="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          image_go="$(sed -n 's/^ARG GOLANG_IMAGE=golang:\([0-9][0-9.]*\)-alpine$/\1/p' Dockerfile)"
          if [[ -z "$module_go" || -z "$image_go" || "$module_go" != "$image_go" ]]; then
            printf 'Docker Go version (%s) must match backend/go.mod (%s)\n' "$image_go" "$module_go" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Verify frontend design governance
        env:
          DESIGN_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/play/main' }}
        run: pnpm --dir frontend run design:verify

      - name: Check protected Fork behavior
        env:
          DESIGN_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/play/main' }}
        run: ./scripts/check-fork-integrity.sh

      - name: Run full backend default tests
        working-directory: backend
        run: go test -count=1 -v ./...

      - name: Install Redis for session ownership tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          redis-server --version

      - name: Run backend unit tests
        working-directory: backend
        run: go test -tags=unit ./...

      - name: Lint frontend
        env:
          DESIGN_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/play/main' }}
        run: pnpm --dir frontend run lint:check

      - name: Type-check frontend
        run: pnpm --dir frontend run typecheck

      - name: Run frontend tests
        env:
          DESIGN_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/play/main' }}
        run: pnpm --dir frontend run test:run

      - name: Build frontend
        run: pnpm --dir frontend run build

  checkin-contract:
    name: Check-in PostgreSQL HTTP and frontend contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: ./scripts/test-checkin-contract.sh
      - run: ./scripts/test-welfare-contract.sh

  affiliate-contract:
    name: Affiliate attribution and reconciliation PostgreSQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify historical evidence and shared monthly statistics
        working-directory: backend
        run: go test -tags=integration -count=1 -timeout=10m ./migrations ./internal/repository -run '^TestAffiliate(HistoricalFirstPayment|Operations)'

  mature-provider-contract:
    name: Provider catalog PostgreSQL and HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify isolated catalog, credential encryption, key idempotency and refresh
        working-directory: backend
        run: go test -tags=integration -count=1 -timeout=8m ./internal/repository ./internal/server/routes -run '^Test(MatureProvider|ProfitOperationsFollowsEventTime)'

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Check document index and local targets
        run: node scripts/check-doc-links.mjs

      - name: Check Markdown links with lychee 2.9.0
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            --offline
            --no-progress
            ./DEV_GUIDE.md
            ./README.md
            ./README_CN.md
            ./README_JA.md
            './docs/**/*.md'
            './deploy/*.md'
          fail: true

  account-ops-selector-browser:
    name: Account-ops selector browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Install isolated Playwright browser
        run: |
          npm install --prefix "$RUNNER_TEMP/account-ops-browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/account-ops-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify actual selector UI and interactions with synthetic data only
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/account-ops-selector
          ACCOUNT_OPS_SELECTOR_BASE: ${{ github.event.pull_request.base.sha || 'origin/play/main' }}
          ACCOUNT_OPS_SELECTOR_EXPECTED_HEAD: ${{ github.sha }}
          SUB2API_PLAYWRIGHT_MODULE: ${{ runner.temp }}/account-ops-browser/node_modules/playwright/index.mjs
        run: node .github/scripts/account-ops-selector-preview.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: account-ops-selector-${{ github.sha }}
          path: ${{ runner.temp }}/account-ops-selector
          if-no-files-found: warn
          retention-days: 30

  encrypted-history-400-browser:
    name: Encrypted history 400 settings browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Install isolated Playwright browser
        run: |
          npm install --prefix "$RUNNER_TEMP/encrypted-history-400-browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/encrypted-history-400-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify actual setting component with synthetic state
        env:
          ENCRYPTED_HISTORY_400_OUTPUT: ${{ runner.temp }}/encrypted-history-400
          ENCRYPTED_HISTORY_400_PLAYWRIGHT_MODULE: ${{ runner.temp }}/encrypted-history-400-browser/node_modules/playwright/index.mjs
        run: node .github/scripts/encrypted-history-400-preview.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-history-400-${{ github.sha }}
          path: ${{ runner.temp }}/encrypted-history-400
          if-no-files-found: error
          retention-days: 30
