name: Key risk PostgreSQL acceptance

on:
  pull_request:
    branches: [play/main]
    paths:
      - 'backend/internal/keyrisk/**'
      - 'backend/internal/handler/admin/key_risk*.go'
      - 'backend/internal/repository/api_key_repo*.go'
      - 'backend/internal/service/api_key_service*.go'
      - 'backend/migrations/*key_risk*.sql'
      - '.github/workflows/key-risk-postgres.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: keyrisk
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keyrisk_task
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyrisk -d keyrisk_task"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KEYRISK_TEST_REQUIRED: 'true'
      KEYRISK_TEST_POSTGRES_DSN: postgres://keyrisk@127.0.0.1:5432/keyrisk_task?sslmode=disable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run PostgreSQL risk and notification regressions with race detection
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json ./internal/keyrisk -count=1 -timeout=10m | tee "$RUNNER_TEMP/key-risk-tests.jsonl"
          python3 - "$RUNNER_TEMP/key-risk-tests.jsonl" <<'PY'
          import json, sys
          rows = [json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          skipped = [row['Test'] for row in rows if row.get('Action') == 'skip' and row.get('Test')]
          passed = {row['Test'] for row in rows if row.get('Action') == 'pass' and row.get('Test')}
          required = {'TestRiskNoticeIncludesAllKeysBeyondFifty', 'TestReminderLimitSurvivesOutboxCleanupAndRestart', 'TestAcknowledgementIsOwnedIdempotentAndSuppressesQueuedMail', 'TestForkFirstMigrationRequiresExplicitEnable', 'TestRestrictionRejectsConcurrentEpisodeOrKeyChanges'}
          if skipped or not required <= passed:
              raise SystemExit(f'Incomplete PostgreSQL acceptance: skipped={skipped}, missing={sorted(required - passed)}')
          print(f'{len(passed)} risk tests passed; no skipped tests')
          PY
