<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group multilingual editor prototype</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f3f4f6; color: #111827; font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
      main { width: 100%; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      section { width: min(100%, 720px); background: white; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 12px 32px rgb(15 23 42 / 12%); }
      header { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; font-size: 18px; font-weight: 600; }
      form { display: grid; gap: 20px; padding: 24px; }
      label { display: block; margin-bottom: 8px; color: #374151; font-weight: 500; }
      .field-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .locale { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; border: 1px solid #d1d5db; border-radius: 6px; background: white; padding: 4px 9px; color: #374151; }
      input, textarea { width: 100%; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; padding: 10px 12px; color: #111827; font: inherit; }
      textarea { min-height: 88px; resize: vertical; }
      .hint { margin: 6px 0 0; color: #6b7280; font-size: 12px; }
      .menu { margin-top: 8px; width: 176px; border: 1px solid #d1d5db; border-radius: 8px; background: white; box-shadow: 0 8px 16px rgb(15 23 42 / 12%); }
      .option { display: flex; justify-content: space-between; padding: 8px 12px; color: #374151; }
      .option.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
      .check { color: #2563eb; font-weight: 700; }
      footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid #e5e7eb; }
      button { min-height: 40px; border: 1px solid #d1d5db; border-radius: 6px; background: white; padding: 0 14px; color: #374151; font: inherit; }
      button.primary { border-color: #2563eb; background: #2563eb; color: white; }
      @media (max-width: 560px) { main { padding: 12px; align-items: start; } section { margin-top: 24px; } header, form { padding-left: 16px; padding-right: 16px; } footer { padding-left: 16px; padding-right: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <section aria-label="Create group">
        <header>创建分组</header>
        <form>
          <div>
            <div class="field-head">
              <label for="name">分组名称</label>
              <button class="locale" type="button" aria-label="编辑语言版本">中文 <span aria-hidden="true">⌄</span></button>
            </div>
            <input id="name" value="标准" />
            <div class="menu" role="listbox" aria-label="语言">
              <div class="option active" role="option" aria-selected="true">中文（默认）<span class="check">✓</span></div>
              <div class="option" role="option">English</div>
            </div>
          </div>
          <div>
            <div class="field-head">
              <label for="description">分组描述</label>
              <button class="locale" type="button" aria-label="编辑语言版本">中文 <span aria-hidden="true">⌄</span></button>
            </div>
            <textarea id="description">常规订阅池</textarea>
            <p class="hint">切换语言后编辑对应译文；留空时显示默认文本。</p>
          </div>
        </form>
        <footer><button type="button">取消</button><button class="primary" type="button">创建</button></footer>
      </section>
    </main>
  </body>
</html>
