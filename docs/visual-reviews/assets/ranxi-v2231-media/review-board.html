<!doctype html><meta charset="utf-8"><title>Media settings review</title>
<style>body{margin:0;background:#f3f4f6;color:#111827;font:15px system-ui;padding:24px}main{max-width:680px;margin:auto}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:20px;margin:16px 0}h1{font-size:22px}h2{font-size:16px;margin:0 0 16px}label{display:block;margin:10px 0}input[type=number]{box-sizing:border-box;display:block;border:1px solid #d1d5db;padding:8px;border-radius:6px;width:100%;margin-top:5px}.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.new{display:none}.upgraded .new{display:block}@media(prefers-color-scheme:dark){body{background:#111827;color:#f3f4f6}.panel{background:#1f2937;border-color:#374151}input[type=number]{background:#111827;color:inherit;border-color:#4b5563}}</style>
<main><h1>极速蹬 · 管理设置</h1><section class="panel"><h2>OpenAI 账号 · 端点能力</h2><label><input type="checkbox" checked> 文本生成</label><label><input type="checkbox" checked> Embeddings</label><label class="new"><input type="checkbox"> OpenAI 视频中转</label></section>
<section class="panel"><h2>OpenAI 分组 · 模型计价</h2><div class="pricing"><label>图片输入价格<input type="number" placeholder="使用默认价格"></label><label>图片输出价格<input type="number" placeholder="使用默认价格"></label><label class="new">每张图片最低收费（USD）<input type="number" min="0" max="1000" step="0.00000001" placeholder="留空则不启用"></label></div></section></main>
<script>if(location.search)document.body.className='upgraded'</script>
