<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>New API authorization prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#202a35;font:14px/1.45 system-ui,-apple-system,sans-serif}.frame{width:1280px;height:820px;padding:42px 52px}.table{background:#fff;border:1px solid #d9dfe5;border-radius:6px;padding:18px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px;padding:16px;border-bottom:1px solid #e5e9ed}.row:last-child{border:0}.rate{color:#576575}.modal{position:absolute;top:70px;left:340px;width:600px;background:#fff;border:1px solid #cfd6dd;border-radius:10px;box-shadow:0 16px 40px #1e293b33}.head,.foot{padding:18px 22px;border-bottom:1px solid #e4e8ec;display:flex;justify-content:space-between;align-items:center}.foot{border:0;border-top:1px solid #e4e8ec;justify-content:flex-end;gap:8px}.body{padding:20px 22px;display:grid;gap:16px}h1{font-size:18px;margin:0;font-weight:600}label{display:grid;gap:6px;font-weight:600;color:#394653}input{height:40px;border:1px solid #bfc9d2;border-radius:6px;padding:8px 10px;background:#fff;color:#64717e}small{font-weight:400;color:#6b7681}.badge{display:inline-block;background:#edf6f0;border:1px solid #c7e2d1;color:#25633c;padding:3px 8px;border-radius:6px;font-size:12px}.result{border:1px solid #d9dfe5;border-radius:6px;padding:12px;display:grid;gap:6px}.actions{display:flex;gap:8px}.button{padding:9px 13px;border:1px solid #c8d0d7;border-radius:6px;background:#fff;color:#293542}.primary{background:#176b59;border-color:#176b59;color:#fff}.muted{color:#697683}.check{display:flex;align-items:center;gap:8px;font-weight:400}@media(max-width:700px){body{background:#fff}.frame{width:auto;height:auto;padding:0}.table{display:none}.modal{position:relative;top:auto;left:auto;width:auto;margin:8px;border-radius:8px;box-shadow:none}.head,.foot{padding:16px}.body{padding:16px;gap:14px}.foot{justify-content:stretch}.button{flex:1;min-width:0;padding:9px 5px;font-size:13px}.check{align-items:flex-start}.check input{height:auto;margin-top:4px}}
</style>
<body><main class="frame"><div class="table"><div class="row"><strong>Accounts</strong><span>Type</span><span>Rate</span><span>Status</span></div><div class="row"><span>Example API account</span><span>API key</span><span class="rate">Configure upstream</span><span>Active</span></div></div><section class="modal" aria-label="New API authorization prototype"><header class="head"><h1>Configure New API authorization</h1><span aria-hidden="true">×</span></header><div class="body"><p class="muted">https://upstream.example/tenant</p><label>Upstream user ID<input value="42" readonly></label><label>System access token<input value="••••••••••••••••" readonly><small>Use a system token, separate from the API key used for model requests.</small></label><label class="check"><input type="checkbox" checked> Apply to accounts already configured for this user at this site</label><div class="result"><div><span class="badge">API key matched</span> Example API account</div><div class="muted">Group: default · Group ratio: 1x</div><div>Wallet balance (normalized USD): $12.34</div></div></div><footer class="foot"><button class="button">Cancel</button><button class="button">Preview</button><button class="button primary">Verify and save</button></footer></section></main></body>
