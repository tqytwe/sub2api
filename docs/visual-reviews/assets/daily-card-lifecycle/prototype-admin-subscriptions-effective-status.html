<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f7f8fa; color: #20242c; font: 14px Arial, sans-serif; }
  .toolbar { height: 72px; padding: 18px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  .toolbar span { display: inline-block; width: 180px; padding: 9px 12px; margin-right: 10px; border: 1px solid #d9dde5; border-radius: 6px; color: #6b7280; }
  table { width: calc(100% - 32px); margin: 16px; border-collapse: collapse; background: #fff; }
  th, td { padding: 16px; border-bottom: 1px solid #e5e7eb; text-align: left; }
  th { color: #596273; font-weight: 600; background: #fafbfc; }
  .group { color: #047857; background: #d1fae5; border-radius: 6px; padding: 4px 8px; }
  .bar { width: 290px; height: 7px; background: #e5e7eb; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar i { display: block; width: 100%; height: 100%; background: #ef4444; }
  .amount { margin-left: 10px; color: #374151; }
  .ended { margin-top: 7px; color: #b45309; font-size: 12px; }
  .status { color: #991b1b; background: #fee2e2; border-radius: 6px; padding: 4px 9px; font-weight: 600; }
  .disabled { color: #9ca3af; }
</style>
<body>

  <table>

        <td>2026/07/29 01:11</td><td><span class="status">已耗尽</span></td><td class="disabled">调整　撤销</td>
      </tr>
      <tr><td>baishun8181@163.com</td><td><span class="group">高级日卡110刀</span></td><td><span class="bar"><i style="width:0;background:#10b981"></i></span><span class="amount">$0.00 / $110.00</span></td><td>2026/07/30 20:54</td><td><span class="group">生效中</span></td><td>调整　撤销</td></tr>
